name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DEBUG: '0'
      SECRET_KEY: ci-only-secret-key-please-change-in-production-0123456789
      ALLOWED_HOSTS: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install "django==6.1.3" ruff

      - name: 代码风格检查
        run: ruff check .

      - name: Django 自检
        run: python manage.py check

      - name: 迁移
        run: python manage.py migrate --noinput

      - name: 管理员初始化
        run: python manage.py ensure_admin

      - name: 部署自检（doctor）
        run: python manage.py doctor

      - name: 单元 / 集成测试
        run: python manage.py test api.tests -v 1

      - name: 健康检查冒烟
        run: |
          python manage.py runserver 127.0.0.1:21114 --noreload > server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:21114/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:21114/api/health

      - name: 失败时打印服务日志
        if: failure()
        run: tail -100 server.log || true

  console-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: 构建 TDesign 控制台
        working-directory: frontend
        run: |
          npm ci
          npm run build
