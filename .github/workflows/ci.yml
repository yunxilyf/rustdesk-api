name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DEBUG: '0'
      SECRET_KEY: ci-Q7vN2pL8xR4tB9mC5kW1sD6fH3jG0aZ-eU7iO2uY9tR4eW8qP3aS5dF1gH
      ALLOWED_HOSTS: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install "django==6.1.3" ruff

      - name: 代码风格检查
        run: |
          ruff check .
          ruff format --check .

      - name: Django 自检
        run: python manage.py check

      - name: 单元测试（仅当仓库带有 api/tests 时）
        run: |
          if [ -d api/tests ]; then
            python manage.py test api.tests -v 1
          else
            echo "api/tests 未随仓库提供，跳过（测试仅维护者本地保留）"
          fi

      - name: 迁移
        run: python manage.py migrate --noinput

      - name: 管理员初始化
        run: |
          SMOKE_ADMIN_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')" \
            python manage.py ensure_admin --noinput

      - name: 部署自检（doctor）
        run: python manage.py doctor

      - name: 健康检查冒烟
        run: |
          python manage.py runserver 127.0.0.1:21114 --noreload > server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:21114/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:21114/api/health

      - name: 失败时打印服务日志
        if: failure()
        run: tail -100 server.log || true

  console-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建 TDesign 控制台
        working-directory: frontend
        run: |
          npm ci
          npm run build
          test -s ../static/console/index.html
