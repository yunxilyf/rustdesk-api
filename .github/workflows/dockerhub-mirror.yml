name: Mirror to Docker Hub

on:
  workflow_dispatch:
    inputs:
      tags:
        description: '要同步的标签，逗号分隔'
        required: true
        default: 'latest'
  release:
    types: [published]

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 从 GHCR 复制到 Docker Hub
        env:
          SRC: ghcr.io/${{ github.repository }}
          DST: ${{ secrets.DOCKERHUB_USERNAME }}/rustdesk-api
          REQUESTED_TAGS: ${{ inputs.tags }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag_list="$REQUESTED_TAGS"
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            tag_list="${RELEASE_TAG#v}"
          fi
          if [[ -z "$tag_list" || "$tag_list" == *$'\n'* || "$tag_list" == *, ]]; then
            echo "Expected a comma-separated list of Docker tags." >&2
            exit 1
          fi
          IFS=',' read -r -a tags <<< "$tag_list"
          for i in "${!tags[@]}"; do
            tag="$(printf '%s' "${tags[i]}" | sed -E 's/^[[:blank:]]+|[[:blank:]]+$//g')"
            if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "Invalid Docker tag at position $((i + 1))." >&2
              exit 1
            fi
            tags[i]="$tag"
          done
          for tag in "${tags[@]}"; do
            echo "==> $SRC:$tag -> $DST:$tag"
            docker buildx imagetools create --tag "$DST:$tag" "$SRC:$tag"
          done
