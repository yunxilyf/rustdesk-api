[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["static", "frontend", "_ops", "_migrate", "api/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
"api/models.py" = ["F403"]
"api/admin.py" = ["F403"]
"api/models_user.py" = ["F403"]
"api/views_api.py" = ["F403", "F405"]
