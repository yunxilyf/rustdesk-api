<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#4D9BFF"/>
      <stop offset="0.45" stop-color="#1868F2"/>
      <stop offset="1" stop-color="#00327F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.65" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#001A4D" stop-opacity="0"/>
      <stop offset="1" stop-color="#001A4D" stop-opacity="0.24"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.72" stop-color="#F2F7FF"/>
      <stop offset="1" stop-color="#DCE9FF"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ptr" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#2F80FF"/>
      <stop offset="0.55" stop-color="#0B54D6"/>
      <stop offset="1" stop-color="#00328C"/>
    </linearGradient>
    <filter id="screenShadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#001A4D" flood-opacity="0.30"/>
    </filter>
    <filter id="standShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#001A4D" flood-opacity="0.22"/>
    </filter>
    <filter id="ptrShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#00266B" flood-opacity="0.28"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.035"/></feComponentTransfer>
    </filter>
    <clipPath id="round"><rect x="0" y="0" width="1024" height="1024" rx="228"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <rect width="1024" height="1024" fill="url(#vign)"/>
    <rect width="1024" height="1024" filter="url(#grain)" opacity="0.5"/>
  </g>
  <rect x="9" y="9" width="1006" height="1006" rx="221" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="8"/>

  <g filter="url(#screenShadow)">
    <rect x="186" y="214" width="652" height="458" rx="76" fill="url(#screen)"/>
  </g>
  <rect x="186" y="214" width="652" height="458" rx="76" fill="url(#glass)"/>
  <rect x="192" y="220" width="640" height="446" rx="70" fill="none" stroke="#0A3C97" stroke-opacity="0.10" stroke-width="5"/>

  <g filter="url(#ptrShadow)" transform="translate(430 316) scale(0.86)">
    <path d="M0 0 L0 300 L78 232 L126 338 L184 312 L136 208 L236 208 Z" fill="url(#ptr)" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round"/>
  </g>

  <g filter="url(#standShadow)">
    <rect x="474" y="690" width="76" height="40" rx="14" fill="#FFFFFF"/>
    <rect x="358" y="726" width="308" height="54" rx="27" fill="#FFFFFF"/>
  </g>
</svg>
